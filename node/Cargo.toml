[package]
name = "glade-node"
version = "0.0.0"
edition = "2021"
# The toolchain floor: iroh 1.2 and its family declare 1.91. The instance lock's
# `File::try_lock` (src/sysdir.rs) needs 1.89, which is below it.
rust-version = "1.91"
description = "Glade node (GLP-0005) — localhost glade server: per-(share,origin) log store, WS carrier, routing, chain verification, echo provider."

[lib]
path = "src/lib.rs"

[[bin]]
name = "glade-node"
path = "src/bin/glade-node.rs"

[dependencies]
glade-wire = { path = "../wire-rs" }
sha2 = "0.10"
# `signal` (plan Step 3.3): the assembled root stops on SIGTERM or SIGINT. It adds
# no crate: iroh's graph already builds tokio with it. `"1"` stays a range; the
# tracked Cargo.lock holds the =1.53.1 that sdax-tokio pins.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
# node<->node QUIC carrier (Lane R step 2). Client-facing WS carrier (ws.rs) has
# no new deps; iroh rides only the peer path. tls-ring gives the crypto provider
# used by presets::Minimal (relay + discovery disabled — direct dial only).
# Floor at 1.2: 1.1.0 fixed a panic on a crafted EndpointAddr, a relay CPU pin and
# NAT-probe misrouting (IrohReview §11). This line records the minimum; the
# tracked Cargo.lock records the version a checkout builds.
iroh = "1.2"
# The assembly (plan Step 3.2, src/assembly.rs): Shaku, pinned exactly at the async
# witness's measured baseline (a caret range would silently test another library),
# and the four framework-free ports of Step 3.1 that its bindings carry.
shaku = "=0.6.3"
glade-carrier-api = { path = "../contracts/carrier-api" }
glade-clock-api = { path = "../contracts/clock-api" }
glade-grant-api = { path = "../contracts/grant-api" }
glade-signer-api = { path = "../contracts/signer-api" }
# Genuine signing (plan Step 4.1a, src/signing.rs): Ed25519 under the node key,
# pinned exactly, because another verification library changes which signatures
# count; the pin also governs iroh's copy (glade/dev-docs/GladeNodeSigning.md D1).
ed25519-dalek = "=3.0.0"
# The seed of a new node.key, from the OS on every platform (/dev/urandom is Unix
# only). 0.4.3 is the version iroh's own randomness already uses; pinned exactly,
# as every 0.x is.
getrandom = "=0.4.3"
# The lifecycle (plan Step 3.3, src/lifecycle.rs): the assembled path's start-up and
# cleanup as one sdax plan. Git-only until crates.io, pinned at the async witness's
# revision (version_pin: every 0.x pinned exactly). sdax, sdax-tokio and, below,
# sdax-testkit share one rev: a mismatch between them is a failure case upstream.
sdax = { git = "https://github.com/owebeeone/sdax-rs", package = "sdax", rev = "ccf06e76a90e22a454471a71f0cf6f5cb878baac" }
sdax-tokio = { git = "https://github.com/owebeeone/sdax-rs", package = "sdax-tokio", rev = "ccf06e76a90e22a454471a71f0cf6f5cb878baac" }

# The same four ports with their conformance suites, which tests/assembly runs
# against the node's deterministic providers (LBT-009).
[dev-dependencies]
glade-carrier-api = { path = "../contracts/carrier-api", features = ["conformance"] }
glade-clock-api = { path = "../contracts/clock-api", features = ["conformance"] }
glade-grant-api = { path = "../contracts/grant-api", features = ["conformance"] }
glade-signer-api = { path = "../contracts/signer-api", features = ["conformance"] }
# The scripted driver and plan invariants tests/release_order.rs runs over the
# node's plan. publish = false upstream, so it can only come from Git.
sdax-testkit = { git = "https://github.com/owebeeone/sdax-rs", package = "sdax-testkit", rev = "ccf06e76a90e22a454471a71f0cf6f5cb878baac" }
