[workspace]
members = ["persistence-api", "binding-api", "invocation-api", "subscription-api", "sync-api", "lifecycle-api"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.0.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
