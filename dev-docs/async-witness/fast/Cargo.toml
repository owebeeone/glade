[package]
name = "async-witness-fast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.architecture]
role = "harness/tool"
purpose = "DI-E01, DI-E02 and DI-E03 over Shaku alone; no runtime, no socket, no sdax"

# No tokio, no iroh, no sdax, and it must stay that way: §4.4's hidden-I/O claim
# is mechanical only while a provider that opens a socket cannot compile into
# this target. Shaku is pinned EXACTLY at the evaluation's measured baseline —
# a caret range would silently retest a different library.
[dependencies]
async-witness-ports = { path = "../ports" }
shaku = "=0.6.3"

# Phase 1's negative fixtures. Three of them MUST FAIL to compile and one MUST
# compile; either way, sweeping them into the gate would invert their meaning,
# so they are examples behind a feature and `check.sh` runs `--lib --tests` and
# never `--all-features --all-targets`, exactly as `di-eval/README.md` records.
# A feature and a target table change no dependency resolution and leave
# `Cargo.lock` untouched.
[features]
negative = []

[[example]]
name = "missing_binding"
required-features = ["negative"]

[[example]]
name = "construction_cycle"
required-features = ["negative"]

[[example]]
name = "ambiguous_role"
required-features = ["negative"]

[[example]]
name = "cfg_scanner_gap"
required-features = ["negative"]

[lints]
workspace = true
